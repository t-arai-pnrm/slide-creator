# pnpm の設定（pnpm 11 から、認証とレジストリ以外の設定はここに書く）

# インストール時スクリプトの実行を許可するパッケージ
allowBuilds:
  # Git フックを設置する
  lefthook: true
  # 画像処理のネイティブバイナリを確かめる
  sharp: true

# 公開から 1 週間（分）経っていない版は解決しない。サプライチェーン攻撃への対策
minimumReleaseAge: 10080

# ロックファイルが例外の版を使わなくなったら、例外リストから自動で消す
minimumReleaseAgeExcludePrune: true

# 以前の版より信頼の段階が下がった版（provenance や trusted publisher が外れた版）を入れない
# 乗っ取られたアカウントからの公開を、公開からの日数に関係なく止める。minimumReleaseAge とは守り方が違う
trustPolicy: no-downgrade
# 公開から 30 日（分）を過ぎた版は検査しない。古い版の信頼の情報の欠けで install を止めないため
trustPolicyIgnoreAfter: 43200
# 正当な理由で信頼の段階が下がった版は、理由（issue の URL など）を添えてここに書く
trustPolicyExclude:
  # CI での公開に失敗し、メンテナーが手で公開したため provenance がない（プラットフォームのパッケージにはある）
  # https://github.com/evilmartians/lefthook/issues/1600 。provenance の付いた次の版に上げたら消す
  - 'lefthook@2.2.2'

# 推移的な依存が git や tarball の URL を指すのを止める。直接の依存だけが使える
# pnpm の版によって既定値が違うので、明示する
blockExoticSubdeps: true
# allowBuilds で許可していないインストール時スクリプトがあれば、警告ではなく失敗にする
strictDepBuilds: true
# peer dependency の欠けや版の不一致を失敗にする
strictPeerDependencies: true
# peer の範囲が古いだけで、いまの版で動くことを確かめたものは、ここで個別に許す
peerDependencyRules:
  allowedVersions:
    # peer は stylelint 16 までだが、taklog では 17 で pnpm lint が通っている
    stylelint-plugin-display-multi-keyword-syntax>stylelint: '17'
# 依存の engines が使っている Node.js の版と合わなければ入れない
engineStrict: true

# 脆弱性のある版を、修正版に置き換える
# 脆弱な範囲だけを選ぶので、親のパッケージが修正版を取り込めば、その行は何もしなくなる。そうなったら消す
overrides:
  # markuplint が ^13.0.6 で求めている。GHSA-3g3m-2fjr-6pw4
  'glob@>=9.0.0 <14.0.2': '^14.0.2'
  # markuplint の経路（glob、typescript-estree、eslint）が使っている。GHSA-g3hv-75wg-m249
  'minimatch@>=7.0.0 <11.0.1': '^11.0.1'

# 追加した依存はキャレットなしの正確な版で package.json に書く
saveExact: true
